<section class="experience" id="trayectoria">
    <div class="experience__container">
        <header class="experience__header">
            <p class="experience__kicker">Trayectoria</p>
            <h2>Experiencia y formación</h2>
        </header>

        <div class="experience__timeline">
            @for (item of experienceItems; track item.title) {
                <article class="experience__item">
                    <div class="experience__marker" aria-hidden="true"></div>

                    <div class="experience__card">
                        <div class="experience__meta">
                            <span class="experience__type">{{ item.type }}</span>
                            <span class="experience__period">{{ item.period }}</span>
                    </div>

                    <h3>{{ item.title }}</h3>

                    <p class="experience__organization">
                        {{ item.organization }}
                    </p>

                    <p class="experience__description">
                    {{ item.description }}
                    </p>

                    <ul class="experience__technologies" aria-label="Tecnologías utilizadas">
                        @for (technology of item.technologies; track technology) {
                            <li>{{ technology }}</li>
                    }
                    </ul>
                </div>
            </article>
            }
        </div>
    </div>
</section>
