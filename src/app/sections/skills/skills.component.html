<section
    class="skills"
    id="tecnologias"
    aria-labelledby="skills-title"
    appRevealOnScroll
    >
    <div class="skills__container">
        <header class="skills__header">
        <p class="skills__kicker">
            Tecnologías
        </p>

        <h2 id="skills-title">
            Stack y herramientas
        </h2>
        </header>

        <div class="skills__matrix">
        @for (group of skillGroups; track group.number) {
            <article class="skills__group">
            <div class="skills__group-number">
                {{ group.number }}
            </div>

            <div class="skills__group-content">
                <h3>
                {{ group.title }}
                </h3>

                <ul
                class="skills__list"
                [attr.aria-label]="'Tecnologías de ' + group.title"
                >
                @for (skill of group.skills; track skill) {
                    <li>
                    {{ skill }}
                    </li>
                }
                </ul>
            </div>
            </article>
        }
        </div>
    </div>
</section>
