<svg class="liquid-glass-filters" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="liquid-glass-pill" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.035"
        numOctaves="2"
        seed="11"
        stitchTiles="stitch"
        result="noise"
      />
      <feGaussianBlur in="noise" stdDeviation="0.35" result="soft-noise" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="soft-noise"
        scale="4"
        xChannelSelector="R"
        yChannelSelector="B"
      />
    </filter>

    <filter id="liquid-glass-panel" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.007 0.018"
        numOctaves="2"
        seed="17"
        stitchTiles="stitch"
        result="noise"
      />
      <feGaussianBlur in="noise" stdDeviation="0.5" result="soft-noise" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="soft-noise"
        scale="6"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>
</svg>
