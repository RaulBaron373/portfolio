<header class="navbar">
  <nav class="navbar__container" aria-label="Navegacion principal">
    <a class="navbar__brand" href="#inicio" aria-label="Ir al inicio">RB</a>

    <button
      class="navbar__toggle"
      [class.navbar__toggle--open]="isMenuOpen"
      type="button"
      aria-label="Abrir menú de navegación"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="navbar__links" [class.navbar__links--open]="isMenuOpen">
      @for (link of navLinks; track link.href) {
        <li>
          <a 
            class="navbar__link" 
            [href]="link.href"
            (click)="closeMenu()"
          >
            {{ link.label }}</a>
        </li>
      }
    </ul>
  </nav>
</header>
